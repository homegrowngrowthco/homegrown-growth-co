[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://assets.calendly.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://assets.calendly.com; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.google.com https://*.clarity.ms https://c.bing.com https://dc.services.visualstudio.com; frame-src https://calendly.com; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests;"

# Cache static assets aggressively.
# /_astro/* is content-hashed by the build, so immutable is always safe.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hero/photo JPGs are mutable filenames: cache a week, serve stale while revalidating.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# woff2 only: fonts.css is hand-edited and unhashed, so it must stay revalidatable.
[[headers]]
  for = "/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean URLs are served natively by Astro's file-format output
# (dist/<slug>.html via build.format: 'file'), so no per-page
# rewrites are needed and no trailing-slash 301s. Netlify serves
# /services from dist/services.html directly. The /resources
# retirement redirect and the trailing 404 fallback below are
# the only redirects this site needs.

# /resources — page retired; permanent redirect to homepage
[[redirects]]
  from = "/resources"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/resources.html"
  to = "/"
  status = 301
  force = true

# 404 — must be last
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
