[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://assets.calendly.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://assets.calendly.com; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.clarity.ms https://dc.services.visualstudio.com; frame-src https://calendly.com; form-action 'self'; object-src 'none'; base-uri 'self';"

# Cache static assets aggressively
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean URLs are served natively by Astro's directory-format output
# (dist/<slug>/index.html), so no per-page rewrites are needed —
# Netlify resolves /services to /services/index.html automatically.
# The /resources retirement redirect and the trailing 404 fallback
# below are the only redirects this site needs.

# /resources — page retired; permanent redirect to homepage
[[redirects]]
  from = "/resources"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/resources.html"
  to = "/"
  status = 301
  force = true

# 404 — must be last
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
